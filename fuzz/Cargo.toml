[package]
name = "agent-router-fuzz"
version = "0.0.1"
publish = false
edition = "2024"
rust-version = "1.85"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "=0.4.13"
router-adapter-api = { path = "../crates/router-adapter-api" }
router-bridge-contract = { path = "../integrations/bridge-contract" }
router-policy = { path = "../crates/router-policy" }
router-types = { path = "../crates/router-types" }
serde_json = "=1.0.151"

[[bin]]
name = "host_snapshot"
path = "fuzz_targets/host_snapshot.rs"
test = false
doc = false
bench = false

[[bin]]
name = "provider_sse"
path = "fuzz_targets/provider_sse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "phase_scope"
path = "fuzz_targets/phase_scope.rs"
test = false
doc = false
bench = false
