[package]
name = "router-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
router-types = { path = "../router-types" }
router-policy = { path = "../router-policy" }
router-workflow = { path = "../router-workflow" }
router-adapter-api = { path = "../router-adapter-api" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
rusqlite = { version = "=0.32.1", features = ["bundled"] }
tokio = { version = "=1.45.1", features = ["process", "rt-multi-thread", "macros", "time", "sync", "io-util"] }
nix = { version = "=0.29.0", features = ["signal", "process", "fs"] }
rustix = { version = "=1.1.4", features = ["fs", "process"] }

[dev-dependencies]
tempfile.workspace = true
router-catalog = { path = "../router-catalog" }
