name: Native Linux runtime enforcement

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install native sandbox and loopback probe tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap netcat-openbsd
      - name: Verify repository Rust version
        run: rustc --version
      - name: Test durable runtime and real resource limits
        run: cargo test -p router-runtime -p router-sandbox-helper --locked
      - name: Require a real address-space allocation refusal
        run: cargo test -p router-sandbox-helper --test limits address_space_limit_rejects_a_real_allocation --locked -- --exact --nocapture
      - name: Require descendant termination after supervisor death
        run: cargo test -p router-sandbox-helper --test lifetime sigkill_bubblewrap_parent_stops_setsid_descendant --locked -- --ignored --exact --nocapture
      - name: Require native Linux read, write and network isolation
        run: cargo test -p router-runtime --test runtime native_bubblewrap_read_write_and_network_canary --locked -- --ignored --exact --nocapture
      - name: Build CLI and native resource helper
        run: cargo build -p agent-router-cli -p router-sandbox-helper --locked
      - name: Require CLI approval, feedback, retention and interruption behavior
        run: cargo test -p agent-router-cli --test native_execution --locked -- --ignored --nocapture --test-threads=1
      - name: Require native workflow artifact handoff
        run: cargo test -p router-coordinator --test workflow native_sandbox_plan_execute_verify_handoff --locked -- --ignored --exact --nocapture
      - name: Require runtime recovery after supervisor SIGKILL
        run: cargo test -p router-runtime --test runtime native_supervisor_sigkill_recovery_waits_for_cleanup_proof --locked -- --ignored --exact --nocapture
      - name: Require public coordinator approval and integration lifecycle
        run: cargo test -p agent-router-cli --test coordinator native_coordinator_cli_run_verify_service_apply_and_purge --locked -- --ignored --exact --nocapture
      - name: Require signed semantic selection under the native sandbox
        run: cargo test -p router-runtime --test runtime native_activated_secondary_with_asset_gate_executes_under_real_sandbox --locked -- --ignored --exact --nocapture
      - name: Require isolated native version probes
        run: cargo test -p router-runtime --test native_version --locked -- --ignored --nocapture --test-threads=1
      - name: Require durable cancellation during version probing
        run: cargo test -p router-runtime --test runtime native_durable_cancel_during_version_probe_waits_for_cleanup_and_never_starts_worker --locked -- --ignored --exact --nocapture
      - name: Require signed CLI execution and historical verification after rollback
        run: cargo test -p agent-router-cli --test backend_execution native_alternate_feedback_and_historical_verification_after_rollback --locked -- --ignored --exact --nocapture
      - name: Require pinned OpenCode and Copilot protocols under the native sandbox
        run: cargo test -p agent-router-cli --all-features --test native_hosts --locked -- --ignored --nocapture --test-threads=1
      - name: Check runtime and helper warnings
        run: cargo clippy -p router-runtime -p router-sandbox-helper --all-targets --locked -- -D warnings
