name: Rust and project harness

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use the repository Rust toolchain
        run: rustup show active-toolchain
      - name: Check bounded native fixture regressions without a provider
        run: |
          python3 -B -m unittest discover -s docs/bench/egress-admission -p test_codex_appserver_local.py -v
          python3 -B -m unittest discover -s docs/bench/native-integration-u02 -p test_probe.py -v
      - name: Replay the recovered subscription host without a provider
        run: python3 -B docs/bench/finite-subscription-relay-2026-10-18/host/test-offline.py
      - name: Check subscription transport diagnostics without a provider
        run: python3 -B docs/bench/finite-subscription-relay-2026-10-18/diagnostic-host/test-offline.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Check the CLI without bundled host adapters
        run: cargo clippy -p agent-router-cli --all-targets --no-default-features --locked -- -D warnings
      - name: Measure disk before workspace tests
        if: runner.os == 'Linux'
        run: |
          df -h .
          du -sh target
      - run: cargo test --workspace --all-features --locked
      - name: Measure disk after workspace tests
        if: ${{ always() && runner.os == 'Linux' }}
        run: |
          df -h .
          if [ -d target ]; then du -sh target; fi
      - name: Test the CLI without the local API feature
        run: cargo test -p agent-router-cli --no-default-features --locked --test local_api_absent
      - name: Reject projection drift, stale files and unsafe paths
        run: cargo run -p xtask --locked -- check
      - name: Parse native configuration syntax
        run: python3 scripts/check-host-syntax.py
      - name: Check Docker resource lifecycle helper
        run: python3 -B scripts/test-docker-lifecycle.py
      - name: Check source distribution boundaries and license evidence
        run: python3 scripts/test-package-core.py
      - name: Fetch all locked dependency archives for license evidence
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: cargo fetch --locked
      - name: Verify real source distribution and complete license evidence
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          python3 scripts/package-core.py --distribution core --strict-licenses --output "$RUNNER_TEMP/agent-router-core.tar.gz"
          python3 scripts/package-core.py --verify "$RUNNER_TEMP/agent-router-core.tar.gz"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan worktree including generated configuration
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo --config /repo/.gitleaks.toml --redact --no-banner
      - name: Scan Git history
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --redact --no-banner
