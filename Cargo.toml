[workspace]
members = [
    "crates/router-prepare",
    "crates/router-asset-contracts",
    "crates/router-coordinator",
    "crates/router-backend-policy",
    "crates/router-execution-decision",
    "crates/router-backend-store",
    "crates/router-advisory-cache",
    "crates/router-types",
    "crates/router-workflow",
    "crates/router-eval",
    "crates/router-decision",
    "crates/router-runtime",
    "crates/router-sandbox-helper",
    "crates/router-doctor",
    "crates/router-feedback",
    "integrations/bridge-contract",
    "crates/router-catalog",
    "crates/router-catalog-store",
    "crates/router-policy",
    "crates/agent-router-cli",
    "crates/router-local-api",
    "crates/router-adapter-api",
    "crates/adapter-codex",
    "crates/adapter-claude",
    "crates/adapter-opencode",
    "crates/adapter-copilot",
    "crates/router-retrieval",
    "crates/router-import",
    "xtask",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
