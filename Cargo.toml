[workspace]
members = [
    "crates/router-types",
    # "crates/router-catalog",
    # "crates/router-policy",
    # "crates/agent-router-cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
