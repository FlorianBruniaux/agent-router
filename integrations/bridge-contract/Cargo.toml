[package]
name = "router-bridge-contract"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.agent-router]
distribution = "integration"

[features]
# Supervised HTTP transport limited to loopback. Off by default; see docs/provider-transport.md.
loopback-transport = ["dep:aho-corasick"]

[dependencies]
router-types = { path = "../../crates/router-types" }
router-policy = { path = "../../crates/router-policy" }
router-adapter-api = { path = "../../crates/router-adapter-api" }
thiserror.workspace = true
serde_json.workspace = true
serde.workspace = true
hex.workspace = true
ed25519-dalek = "=2.2.0"
aho-corasick = { version = "1.1.5", optional = true }

[dev-dependencies]
router-catalog = { path = "../../crates/router-catalog" }
